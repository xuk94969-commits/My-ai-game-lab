<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 游戏生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #121214; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #gameCanvas { flex: 1; width: 100%; background: #000; }
    .input-box { padding: 12px; display: flex; gap: 8px; background: #18181c; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #38bdf8; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 游戏画面在这里显示 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 底部输入框 -->
  <div class="input-box">
    <input type="text" id="cmd" placeholder="输入你想玩的游戏（如：做一个跑酷游戏）">
    <button id="btn">生成</button>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('cmd');

    btn.onclick = async () => {
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = '生成中...';

      try {
        const res = await fetch('/api/game', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: text })
        });
        const data = await res.json();

        if (data.error) {
          alert(data.error);
        } else if (data.jsCode) {
          // 清除旧游戏
          if (typeof window.__destroyCurrentGame === 'function') {
            window.__destroyCurrentGame();
          }
          // 运行新游戏代码
          new Function(data.jsCode)();
        }
      } catch (e) {
        alert('网络请求失败');
      } finally {
        btn.disabled = false;
        btn.innerText = '生成';
        input.value = '';
      }
    };
  </script>
</body>
</html>
