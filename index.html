<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Toolkits</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827;
            color: #f3f4f6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #1f2937;
            padding: 20px;
            border-right: 1px solid #374151;
            display: flex;
            flex-direction: column;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-list { flex: 1; overflow-y: auto; }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: #9ca3af; font-size: 16px; }
        #game-container {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            bottom: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            z-index: 5;
        }
        #gameCanvas {
            background-color: #111827;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        .input-container {
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        .prompt-box {
            width: 100%;
            max-width: 800px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 6px 16px;
        }
        .prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px;
            font-size: 15px;
            outline: none;
        }
        .btn-generate {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-generate:hover { background-color: #0369a1; }
        .btn-generate:disabled { background-color: #4b5563; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">
            <span>🕒</span> 历史游戏
        </div>
        <div class="history-list" id="historyList"></div>
    </div>

    <div class="main-content">
        <div class="hero" id="heroText">
            <h1>欢迎回到 AI Game Toolkits</h1>
            <p>你想创作什么游戏呢？在下方输入你的构想吧！</p>
        </div>

        <div id="game-container" style="display: none;">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>

        <div class="input-container">
            <div class="prompt-box">
                <input type="text" id="promptInput" class="prompt-input" placeholder="例如：做一个2D跑酷游戏，按空格键跳跃..." />
                <button class="btn-generate" id="generateBtn">生成游戏</button>
            </div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const gameContainer = document.getElementById('game-container');
        const heroText = document.getElementById('heroText');

        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();

            if (!prompt) {
                alert('请输入游戏生成需求！');
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = '生成中...';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '生成失败');
                }

                const gameCode = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (gameCode) {
                    heroText.style.display = 'none';
                    gameContainer.style.display = 'flex';

                    if (window.__destroyCurrentGame) {
                        try { window.__destroyCurrentGame(); } catch (e) {}
                    }

                    const cleanCode = gameCode.replace(/```javascript/g, '').replace(/```/g, '');
                    eval(cleanCode);
                } else {
                    alert('未能解析到有效的游戏代码，请重试');
                }

            } catch (error) {
                console.error('生成出错:', error);
                alert('请求失败: ' + error.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = '生成游戏';
            }
        });
    </script>
</body>
</html>
